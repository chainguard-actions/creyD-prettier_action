name: Test dry run detects unpretty files
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      GITHUB_ACTOR: testuser
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a badly-formatted JS file in workspace
        run: |
          # Write a badly-formatted JS file (missing semicolons, wrong quotes, etc.)
          printf "const x=1\nconst y=    2\nif(x){console.log(y)}\n" > "$GITHUB_WORKSPACE/ugly.js"
          git add "$GITHUB_WORKSPACE/ugly.js"
          git commit -m "add ugly js" || true
          echo "Badly formatted file created:"
          cat "$GITHUB_WORKSPACE/ugly.js"

      - id: action
        uses: .
        with:
          dry: "true"
          no_commit: "false"
          prettier_options: "--write ugly.js"
          working_directory: "${{ github.workspace }}"
          github_token: "dummy-token"
        continue-on-error: true

      - name: Assert action failed (unpretty files detected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when dry=true and files are unpretty, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly detected unpretty files and exited with failure"
