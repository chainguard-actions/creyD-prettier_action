name: Test commit_options input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a well-formatted JS file (no prettier changes needed)
        run: |
          cat > test-file.js << 'EOF'
          const x = 1;
          EOF

      - name: Run action with commit_options in dry mode
        id: action
        uses: .
        with:
          dry: true
          prettier_options: "--check **/*.js"
          commit_options: "--no-verify"
          file_pattern: "*.js"

      - name: Assert action completed without error
        run: |
          echo "Action completed successfully with commit_options input"
          echo "PASS"
