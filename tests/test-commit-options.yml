name: Test commit_options input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a well-formatted JS file in the workspace
      - name: Set up pretty JS file
        run: |
          # Write a properly formatted JS file (prettier default style: double quotes, semicolons)
          printf 'const x = 1;\nconst y = 2;\n' > "$GITHUB_WORKSPACE/commit-options-test.js"

      - name: Run prettier action with commit_options set
        id: action
        uses: .
        with:
          prettier_options: "--write ${{ github.workspace }}/commit-options-test.js"
          commit_options: "--no-verify"
          dry: "false"
          no_commit: "true"
          clean_node_folder: "true"

      - name: Assert action succeeded
        run: |
          echo "PASS: action completed with commit_options set"

      - name: Cleanup
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/commit-options-test.js"
