name: Test no_commit mode with pretty files
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a well-formatted JS file in the workspace
      - name: Set up pretty JS file
        run: |
          # Write a properly formatted JS file (prettier default style)
          printf 'const x = 1;\nconst y = 2;\n' > "$GITHUB_WORKSPACE/nocommit-test.js"

      - name: Run prettier action with no_commit=true
        id: action
        uses: .
        with:
          prettier_options: "--write ${{ github.workspace }}/nocommit-test.js"
          dry: "false"
          no_commit: "true"
          clean_node_folder: "true"

      - name: Assert action succeeded without committing
        run: |
          echo "PASS: action completed in no_commit mode"

      - name: Cleanup
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/nocommit-test.js"
