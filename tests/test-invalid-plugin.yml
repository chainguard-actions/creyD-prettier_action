name: Test invalid prettier plugin name rejection
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a JS file in the workspace
      - name: Set up JS file
        run: |
          printf 'const x = 1;\n' > "$GITHUB_WORKSPACE/plugin-test.js"

      - name: Run prettier action with invalid plugin name (should fail)
        id: action
        uses: .
        with:
          prettier_options: "--check ${{ github.workspace }}/plugin-test.js"
          prettier_plugins: "not-a-valid-plugin-name"
          dry: "false"
          no_commit: "true"
          clean_node_folder: "true"
        continue-on-error: true

      - name: Assert action failed due to invalid plugin name
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid plugin name, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected invalid plugin name"

      - name: Cleanup
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/plugin-test.js"
