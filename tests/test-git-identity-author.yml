name: Test git_identity author mode
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      GITHUB_ACTOR: testuser
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a badly-formatted JS file in workspace
        run: |
          # Write a badly-formatted JS file to trigger git changes
          printf "const a=1;const b=2\n" > "$GITHUB_WORKSPACE/code.js"
          git add "$GITHUB_WORKSPACE/code.js"
          git commit -m "add code js" || true
          echo "File created:"
          cat "$GITHUB_WORKSPACE/code.js"

      - id: action
        uses: .
        with:
          prettier_options: "--write code.js"
          no_commit: "true"
          git_identity: "author"
          working_directory: "${{ github.workspace }}"
          github_token: "dummy-token"

      - name: Assert action succeeded with author identity
        run: |
          echo "Action completed successfully with git_identity=author"
          echo "PASS"
