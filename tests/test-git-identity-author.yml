name: Test git_identity author mode
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a well-formatted JS file in the workspace
      - name: Set up pretty JS file
        run: |
          printf 'const x = 1;\nconst y = 2;\n' > "$GITHUB_WORKSPACE/identity-test.js"

      - name: Run prettier action with git_identity=author
        id: action
        uses: .
        with:
          prettier_options: "--check ${{ github.workspace }}/identity-test.js"
          dry: "false"
          no_commit: "true"
          git_identity: "author"
          clean_node_folder: "true"

      - name: Assert action succeeded with author git identity
        run: |
          echo "PASS: action completed with git_identity=author"

      - name: Cleanup
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/identity-test.js"
