name: Test dry run with already-pretty files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git identity
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Run prettier action in dry mode on already-formatted file
        id: action
        uses: .
        with:
          dry: "true"
          no_commit: "true"
          prettier_options: "--write ${{ github.workspace }}/tests/fixtures/pretty.js"

      - name: Assert action succeeded (no unpretty files detected)
        run: |
          echo "PASS: action completed without error - files are already pretty"
