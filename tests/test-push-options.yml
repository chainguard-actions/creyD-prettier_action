name: Test push_options input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a well-formatted JS file
        run: |
          cat > /tmp/test-file.js << 'EOF'
          const x = 1;
          EOF
          cp /tmp/test-file.js "$GITHUB_WORKSPACE/test-push-options.js"
      - id: action
        uses: .
        with:
          dry: "true"
          prettier_options: "--check **/*.js"
          push_options: "--force-with-lease"
          prettier_version: "latest"
        continue-on-error: true
      - name: Assert action ran with push_options input
        run: |
          echo "Action completed (dry mode with push_options set)"
          echo "outcome: ${{ steps.action.outcome }}"
          # In dry mode, the action checks formatting but does not push.
          # We just verify the action ran (not a setup/infrastructure failure).
          # A 'failure' outcome here means prettier found unformatted files, which is acceptable.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with push_options input"
      - name: Cleanup
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/test-push-options.js"
