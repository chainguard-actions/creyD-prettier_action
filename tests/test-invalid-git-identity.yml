name: Test invalid git_identity value causes failure
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      GITHUB_ACTOR: testuser
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a badly-formatted JS file in workspace
        run: |
          # Write a badly-formatted JS file to trigger git changes (so _git_setup is called)
          printf "const a=1;const b=2\n" > "$GITHUB_WORKSPACE/badid.js"
          git add "$GITHUB_WORKSPACE/badid.js"
          git commit -m "add badid js" || true
          echo "File created:"
          cat "$GITHUB_WORKSPACE/badid.js"

      - id: action
        uses: .
        with:
          prettier_options: "--write badid.js"
          no_commit: "false"
          git_identity: "invalid-identity"
          working_directory: "${{ github.workspace }}"
          github_token: "dummy-token"
        continue-on-error: true

      - name: Assert action failed due to invalid git_identity
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid git_identity, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected invalid git_identity value"
