name: Test invalid git_identity value rejection
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create an UNPRETTY JS file so prettier --write will change it,
      # triggering _git_setup which validates git_identity
      - name: Set up unpretty JS file
        run: |
          printf "const x=1\nconst y=2\n" > "$GITHUB_WORKSPACE/badidentity-test.js"

      - name: Run prettier action with invalid git_identity (should fail)
        id: action
        uses: .
        with:
          # --write will reformat the unpretty file, causing git changes
          # then _git_setup is called which checks git_identity and exits 1
          prettier_options: "--write ${{ github.workspace }}/badidentity-test.js"
          dry: "false"
          no_commit: "false"
          git_identity: "invalid-identity"
          clean_node_folder: "true"
        continue-on-error: true

      - name: Assert action failed due to invalid git_identity
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid git_identity, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected invalid git_identity value"

      - name: Cleanup
        if: always()
        run: |
          git checkout -- "$GITHUB_WORKSPACE/badidentity-test.js" 2>/dev/null || true
          rm -f "$GITHUB_WORKSPACE/badidentity-test.js"
